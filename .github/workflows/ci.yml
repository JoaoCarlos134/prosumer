name: CI

# Roda so na biblioteca e no site (webapp/). O benchmark em experimentos/ nao entra: ele precisa dos dados das usinas,
# que sao de terceiros e nao estao no repositorio (removidos do historico em 04/11/2026); os testes que os usam pulam.
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "examples/**", "docs/library/**", "webapp/**", "pyproject.toml", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "examples/**", "docs/library/**", "webapp/**", "pyproject.toml", ".github/workflows/ci.yml"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runner fixo em ubuntu-24.04: o ubuntu-latest passa para o Ubuntu 26 em 19/10/2026, e trocar de sistema
# deve ser uma mudanca deliberada (subir o numero aqui), nao uma surpresa num push qualquer.
# Instalacao: o setup-uv cria e ativa um venv com a versao pedida. Nao usar `uv pip install --system`:
# no runner Ubuntu o python do sistema e "externally managed" (PEP 668) e o uv recusa (codigo 2).
jobs:
  qualidade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # hatch-vcs precisa do historico para derivar a versao
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml # nao ha uv.lock
      - name: Instala
        run: uv pip install -e ".[dev,plots]"
      - name: ruff (lint)
        run: ruff check src tests examples
      - name: ruff (formato)
        run: ruff format --check src tests examples
      - name: mypy
        run: mypy

  testes:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      # lightgbm: sem ele os testes do LightGBM e o caminho padrao do app.run (models="lightgbm") eram pulados
      - name: Instala
        run: uv pip install -e ".[dev,plots,lightgbm]"
      # -n auto: os runners tem 4 CPUs; em serie a suite passa de 20 min
      - name: pytest
        run: pytest -n auto --cov --cov-report=term-missing --cov-report=xml
      # Artefatos: guardados 3 dias e sem derrubar o job. Em 21/10/2026 a cota de armazenamento de artefatos da
      # conta estourou e o upload deixou o CI vermelho com os testes todos passando.
      - name: Guarda a cobertura
        if: matrix.python == '3.12'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: cobertura
          path: coverage.xml
          retention-days: 3

  # O site (webapp/): os testes do servidor (sem rede: usam as falsificacoes de tests/test_app.py), o ruff e a
  # pagina compilada (tsc estrito + vite). O executavel do Windows nao: PyInstaller nao faz compilacao cruzada.
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Instala
        run: uv pip install -e ".[dev,lightgbm]" -r webapp/requirements.txt
      - name: ruff
        run: ruff check webapp/server webapp/tests && ruff format --check webapp/server webapp/tests
      - name: pytest (servidor)
        working-directory: webapp
        run: python -m pytest tests
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/web/package-lock.json
      - name: Compila a pagina
        working-directory: webapp/web
        run: npm ci && npm run build

  empacota:
    runs-on: ubuntu-24.04
    needs: [qualidade, testes]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Constroi sdist e wheel
        run: uv build
      - name: Confere os metadados do pacote
        run: uvx twine check dist/*
      - name: Guarda o pacote
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 3
