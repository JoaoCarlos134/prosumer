name: CI

# Roda so no que e da biblioteca. O benchmark em experimentos/ nao entra: ele precisa dos dados das usinas,
# que sao de terceiros (o arquivo esta no repositorio, que e privado, mas o CI nao o usa).
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "examples/**", "docs/library/**", "pyproject.toml", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "examples/**", "docs/library/**", "pyproject.toml", ".github/workflows/ci.yml"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runner fixo em ubuntu-24.04: o ubuntu-latest passa para o Ubuntu 26 em 19/10/2026, e trocar de sistema
# deve ser uma mudanca deliberada (subir o numero aqui), nao uma surpresa num push qualquer.
# Instalacao: o setup-uv cria e ativa um venv com a versao pedida. Nao usar `uv pip install --system`:
# no runner Ubuntu o python do sistema e "externally managed" (PEP 668) e o uv recusa (codigo 2).
jobs:
  qualidade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # hatch-vcs precisa do historico para derivar a versao
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml # nao ha uv.lock
      - name: Instala
        run: uv pip install -e ".[dev,plots]"
      - name: ruff (lint)
        run: ruff check src tests examples
      - name: ruff (formato)
        run: ruff format --check src tests examples
      - name: mypy
        run: mypy

  testes:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      # lightgbm: sem ele os testes do LightGBM e o caminho padrao do app.run (models="lightgbm") eram pulados
      - name: Instala
        run: uv pip install -e ".[dev,plots,lightgbm]"
      # -n auto: os runners tem 4 CPUs; em serie a suite passa de 20 min
      - name: pytest
        run: pytest -n auto --cov --cov-report=term-missing --cov-report=xml
      - name: Guarda a cobertura
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: cobertura
          path: coverage.xml

  empacota:
    runs-on: ubuntu-24.04
    needs: [qualidade, testes]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Constroi sdist e wheel
        run: uv build
      - name: Confere os metadados do pacote
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
