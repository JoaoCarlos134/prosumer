name: CI

# Roda so no que e da biblioteca. O benchmark em experimentos/ nao entra: ele precisa dos dados
# das usinas, que sao de terceiros e nao estao no repositorio.
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "pyproject.toml", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "pyproject.toml", ".github/workflows/ci.yml"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs precisa do historico para derivar a versao
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Instala
        run: uv pip install --system -e ".[dev,graficos]"
      - name: ruff (lint)
        run: ruff check src tests
      - name: ruff (formato)
        run: ruff format --check src tests
      - name: mypy
        run: mypy

  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - name: Instala
        run: uv pip install --system -e ".[dev,graficos]"
      - name: pytest
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Guarda a cobertura
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml

  empacota:
    runs-on: ubuntu-latest
    needs: [qualidade, testes]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - name: Constroi sdist e wheel
        run: |
          uv pip install --system build twine
          python -m build
      - name: Confere os metadados do pacote
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
