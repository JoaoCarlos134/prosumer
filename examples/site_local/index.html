<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prosumer: next days</title>
<style>
body { font-family: sans-serif; max-width: 700px; margin: 1em auto; padding: 0 16px; }
fieldset { margin-bottom: 1em; }
label { display: block; margin: .4em 0; }
input[type=text], input[type=number], select { width: 100%; box-sizing: border-box; }
.small { font-size: 85%; color: #555; }
</style>
</head>
<body>
<h1>Forecast the next days</h1>
<p class="small">Local page: your file stays on this computer. Only the address (if you type one) and the
coordinates rounded to ~1 km (for the weather forecast) are sent out.</p>

<form method="post" enctype="multipart/form-data">
  <fieldset>
    <legend>Required</legend>
    <label>Your data (CSV: a time column and an energy column, hourly or finer)
      <input type="file" name="csv" accept=".csv,.txt" required></label>
    <label>What it is
      <select name="quantity">
        <option value="generation">Solar production</option>
        <option value="consumption">Consumption</option>
      </select></label>
    <label>Address or place (or the coordinates below)
      <input type="text" name="address" placeholder="Strand Street, Dingle, Ireland"></label>
    <label>Days ahead (1-35; the weather reaches ~16, beyond that only the season)
      <input type="number" name="days" value="7" min="1" max="35"></label>
  </fieldset>

  <fieldset>
    <legend>Optional: each one helps</legend>
    <label>Latitude <input type="number" step="any" name="latitude"></label>
    <label>Longitude <input type="number" step="any" name="longitude"></label>
    <label>Panel tilt, degrees (0 = flat) <input type="number" step="any" name="tilt"></label>
    <label>Panel azimuth, degrees (compass: 0 north, 90 east, 180 south, 270 west)
      <input type="number" step="any" name="azimuth"></label>
    <label>Peak power of the panels, kWp <input type="number" step="any" name="kwp"></label>
    <label>Hours your heavy load runs (washing machine, EV, pump) <input type="number" name="load_hours" value="3" min="1" max="24"></label>
  </fieldset>

  <fieldset>
    <legend>Optional: about the file (guessed when empty)</legend>
    <label>Time column name <input type="text" name="time_column"></label>
    <label>Energy column name <input type="text" name="value_column"></label>
    <label>Unit
      <select name="unit"><option>kWh</option><option>Wh</option><option>kW</option><option>W</option></select></label>
    <label>Each row is
      <select name="kind">
        <option value="interval">the energy of its interval</option>
        <option value="cumulative">a meter counter reading</option>
        <option value="power">the average power of its interval (use kW or W)</option>
      </select></label>
    <label>Time zone of the times in the file (e.g. America/Sao_Paulo; empty = the site's)
      <input type="text" name="timezone"></label>
  </fieldset>

  <button type="submit">Forecast</button>
</form>
</body>
</html>
