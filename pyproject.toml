[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "prosumer"
description = "Day-ahead forecasting of energy prosumers' generation and consumption, from meter data to embedded models"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
authors = [{ name = "Joao Carlos Jachenski Junior" }]
keywords = ["photovoltaic", "forecasting", "time series", "prosumer", "energy", "edge ai"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
# Deliberately lean core (PROPOSTA_BIBLIOTECA.md section 6): only what everyone uses.
# Each foundation model is an isolated extra, with a pinned version.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scipy>=1.11",
  "pandera>=0.20",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4.0"]
# pvlib (NREL SPA, more models) is optional: `prosumer.physics` is numpy only, and pvlib pulls h5py, which the
# Smart App Control of the home machine blocks (2026-10-11).
pvlib = ["pvlib>=0.11"]
# One extra per vendor: when one of their APIs changes, one adapter breaks, not the project.
chronos = ["chronos-forecasting>=2.0"]
timesfm = ["timesfm>=3.0"]
ttm = ["granite-tsfm"]
networks = ["neuralforecast>=3.1", "torch>=2.2"]
embedded = ["onnx>=1.16", "onnxruntime>=1.18", "skl2onnx>=1.17", "emlearn>=0.21"]
plots = ["matplotlib>=3.8"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-xdist>=3",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs",
  "pre-commit>=3.8",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[project.urls]
Repository = "https://github.com/JoaoCarlos134/prosumer"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/prosumer"]
# py.typed: without this marker, mypy in downstream projects ignores the library's annotations.
artifacts = ["src/prosumer/py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "NPY", "PD"]
# RUF001/002/003: some comments and docstrings keep Portuguese text with accents.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
packages = ["prosumer"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:prosumer.*"]

[tool.coverage.run]
source = ["prosumer"]
branch = true
