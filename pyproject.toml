[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "prosumer"
description = "Day-ahead forecasting of energy prosumers' generation and consumption, from meter data to embedded models"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
authors = [{ name = "Joao Carlos Jachenski Junior" }]
keywords = ["photovoltaic", "forecasting", "time series", "prosumer", "energy", "edge ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
# Deliberately lean core (PROPOSTA_BIBLIOTECA.md section 6): only what everyone uses.
# Each foundation model is an isolated extra, with a pinned version.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scipy>=1.11",
  "pandera>=0.20",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4.0", "scikit-learn>=1.3"]  # the LGBMRegressor wrapper needs scikit-learn
# pvlib (NREL SPA, more models) is optional: `prosumer.physics` is numpy only, and pvlib pulls h5py, which the
# Smart App Control of the home machine blocks (2026-10-11).
pvlib = ["pvlib>=0.11"]
# Downloads (io.open_meteo) use the standard library; truststore makes them work behind proxies that inspect
# TLS with the system certificates (the Lactec network).
net = ["truststore>=0.9"]
# Reading Excel files (io.fronius Solar.web exports, io.meter tables); CSV needs nothing extra.
fronius = ["openpyxl>=3.1"]
# One extra per vendor: when one of their APIs changes, one adapter breaks, not the project.
chronos = ["chronos-forecasting>=2.0"]
# TiRex-2 has no PyPI release: install it from git (a direct reference cannot go in an extra), e.g.
#   uv pip install "tirex-2 @ git+https://github.com/NX-AI/tirex-2@e68253bd5a99fd2de92c2ebee11d93a16b2a5e68"
# It and Toto-2.0 need a newer torch than Chronos-2; their environment is frozen in
# experimentos/testes_previsao/ambientes/lote2.txt.
toto2 = ["toto-2==2.0.0"]
timesfm = ["timesfm>=3.0"]
# TTM and FlowState (`tsfm_public`). granite-tsfm 0.3.9 (the benchmark's) pins scikit-learn < 1.8, so it may
# not share an environment with a newer scikit-learn (the Lactec library env has 1.9: FlowState runs in the
# benchmark's `previsao` env with the library on PYTHONPATH).
ttm = ["granite-tsfm>=0.3.9"]
networks = ["neuralforecast>=3.1", "torch>=2.2"]
# `prosumer.embedded` (C headers for the ESP32) needs only numpy plus the library that fitted the model
# (scikit-learn or LightGBM). This extra is for the other routes of the study (docs/projeto/ESTUDO_EMBARCADO.md):
# ONNX on the Raspberry Pi, emlearn for comparison, and ziglang to compile the C in the tests (C -> WebAssembly,
# run with Node: the Smart App Control of the home machine blocks locally built .exe files).
# setuptools: emlearn imports distutils, gone from the standard library in Python 3.12.
embedded = ["onnx>=1.16", "onnxruntime>=1.18", "skl2onnx>=1.17", "emlearn>=0.21", "setuptools", "ziglang>=0.13"]
plots = ["matplotlib>=3.8"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-xdist>=3",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs",
  "pre-commit>=3.8",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[project.urls]
Repository = "https://github.com/JoaoCarlos134/prosumer"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/prosumer"]
# py.typed: without this marker, mypy in downstream projects ignores the library's annotations.
artifacts = ["src/prosumer/py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "NPY", "PD"]
# RUF001/002/003: some comments and docstrings keep Portuguese text with accents.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
packages = ["prosumer"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:prosumer.*"]

[tool.coverage.run]
source = ["prosumer"]
branch = true
